name: "Cognitive Dark V2.1 — Multi-Platform Daily Pipeline"

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "youtube,facebook,instagram"
        required: false
        type: string
      dry_run:
        description: "build only, no uploads"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 12 * * *"
    - cron: "0 17 * * *"
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: cognitive-dark-pipeline
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Kokoro model
        uses: actions/cache@v4
        with:
          path: data/models/kokoro
          key: kokoro-onnx-${{ runner.os }}-v1

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu espeak-ng

      - name: Install Python deps
        run: |
          python -m pip install -q --upgrade pip
          pip install -q -r requirements.txt kokoro-onnx onnxruntime

      - name: Ensure music assets
        run: |
          mkdir -p assets/music
          ls assets/music/*.wav 2>/dev/null || python scripts/generate_music.py || echo "Continuing without music assets"

      - name: Offline smoke test
        run: python src/main.py --selftest

      - name: Run pipeline
        env:
          # V2.1: accept BOTH secret naming schemes via || fallback so a
          # mismatch between workflows can never silently drop credentials.
          PLATFORMS: ${{ inputs.platforms || 'youtube,facebook,instagram' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_CREDENTIALS: ${{ secrets.YOUTUBE_CREDENTIALS || secrets.YOUTUBE_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID || secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN || secrets.FB_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_USER_ID || secrets.IG_BUSINESS_ACCOUNT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN || secrets.FACEBOOK_ACCESS_TOKEN || secrets.IG_ACCESS_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TTS_PRIMARY: "onnx"
          KOKORO_VOICE: "am_fenrir"
          KOKORO_MODEL_DIR: "data/models/kokoro"
        # V2.1: no `|| echo` — a crashed pipeline must turn the run RED so it
        # is noticed, instead of reporting success while uploading nothing.
        run: python src/main.py --platforms "$PLATFORMS" $([ "$DRY_RUN" = "1" ] && echo --dry-run)

      - name: Commit learning memory back
        run: |
          git config user.name "Cognitive Dark Bot"
          git config user.email "bot@cognitivedark.local"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true
          git add -f data/learning_store.json data/run_journal.json data/monetization_progress.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "🤖 Update ML learning store + journal [skip ci]" && git push)
        continue-on-error: true

  metrics-sync:
    runs-on: ubuntu-latest
    needs: build-and-publish
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install -q -r requirements.txt google-api-python-client google-auth-oauthlib
      - name: Fetch metrics & update ML
        env:
          # V2.1: pass YT creds here too (V2 omitted them → YT metrics never
          # synced in CI). Both naming schemes accepted.
          YOUTUBE_CREDENTIALS: ${{ secrets.YOUTUBE_CREDENTIALS || secrets.YOUTUBE_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID || secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN || secrets.FB_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_USER_ID || secrets.IG_BUSINESS_ACCOUNT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN || secrets.FACEBOOK_ACCESS_TOKEN || secrets.IG_ACCESS_TOKEN }}
        run: python scripts/fetch_metrics.py || echo "Metrics sync completed with warnings"
      - name: Commit metrics
        run: |
          git config user.name "Cognitive Dark Bot"
          git config user.email "bot@cognitivedark.local"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true
          git add -f data/*.json data/metrics_report.md 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "📊 Sync metrics [skip ci]" && git push)
        continue-on-error: true
