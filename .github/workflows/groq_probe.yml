name: "GROQ probe (debug)"
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Full API test with secret
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          echo "LEN=${#GROQ_API_KEY} PREFIX=${GROQ_API_KEY:0:4} LAST4=${GROQ_API_KEY: -4}"
          echo "--- direct curl ---"
          curl -s -i -H "Authorization: Bearer ${GROQ_API_KEY}" \
            "https://api.groq.com/openai/v1/models" | head -30
