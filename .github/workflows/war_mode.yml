name: "⚔️ Cognitive Dark - 30 Day Monetization War Plan"

on:
  schedule:
    # 4 videos per day for maximum growth - US Peak Times
    - cron: "0 10 * * *"   # 6am ET
    - cron: "0 14 * * *"   # 10am ET
    - cron: "0 18 * * *"   # 2pm ET
    - cron: "0 22 * * *"   # 6pm ET
  workflow_dispatch:

permissions:
  contents: write

jobs:
  war-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng
          python -m pip install -q --upgrade pip
          pip install -q -r requirements.txt kokoro-onnx onnxruntime
      - name: Run ML Autonomous Pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_CREDENTIALS: ${{ secrets.YOUTUBE_CREDENTIALS }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          WAR_MODE: "true"
        run: python src/main.py
      - name: Sync Learning Data
        if: always()
        run: |
          git config user.name "Cognitive Dark Brain"
          git config user.email "brain@cognitivedark.ai"
          git add data/
          git commit -m "🧠 ML: Daily autonomous update [skip ci]" || echo "No changes"
          git push
