name: "CI — lint, tests, data validation"

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest ruff

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu

      - name: Validate JSON data files
        run: |
          set -e
          if grep -lE '^(<<<<<<<|>>>>>>>)' data/*.json 2>/dev/null; then
            echo "ERROR: conflict markers found in data files" >&2
            exit 1
          fi
          for f in data/*.json; do
            python -m json.tool "$f" >/dev/null
            echo "OK $f"
          done

      - name: Ruff lint
        run: ruff check src scripts config tests

      - name: Pytest
        env:
          PYTHONPATH: src
        run: pytest -q tests

      - name: Pipeline selftest (renders a real video)
        env:
          PYTHONPATH: src
        run: python src/main.py --selftest
